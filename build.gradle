plugins {
	id 'fabric-loom' version '1.10-SNAPSHOT'
	id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

base {
	archivesName = project.archives_base_name
}

repositories {
	// Стандартные репозитории для других зависимостей
	maven { url = "https://maven.terraformersmc.com/" }
	maven { url = "https://maven.ladysnake.org/releases" }
	maven { url = "https://maven.shedaniel.me/" }
}

loom {
	splitEnvironmentSourceSets()

	mods {
		"origins_winter_fabric" {
			sourceSet sourceSets.main
			sourceSet sourceSets.client
		}
	}
}

dependencies {
	// Minecraft и Fabric API
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
	modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
	modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"

	// Локальные зависимости напрямую из папки libs
	modImplementation files('libs/Origins-1.19.2-1.7.1.jar')
	modImplementation files('libs/medieval-origins-5.1.9.2+1.19.2.jar')
	modImplementation files('libs/Pehkui-3.8.3+1.14.4-1.21.jar')  // Добавляем Pehkui для Medieval Origins
	modImplementation files('libs/environmentz-2.0.5.jar')
	modImplementation files('libs/extrakeybinds-0.5.0+1.17-1.19.4.jar')

	modImplementation "net.fabricmc.fabric-api:fabric-particles-v1:0.2.15+3d75e5b490"
	modImplementation "net.fabricmc.fabric-api:fabric-renderer-api-v1:0.4.18+2efa6deb90"
	modImplementation "net.fabricmc.fabric-api:fabric-renderer-indigo:0.5.7+2efa6deb90"
	modImplementation "net.fabricmc.fabric-api:fabric-api:0.67.0+1.19.2"
}

processResources {
	inputs.property "version", project.version

	filesMatching("fabric.mod.json") {
		expand "version": inputs.properties.version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 17
}

java {
	withSourcesJar()
	sourceCompatibility = JavaVersion.VERSION_17
	targetCompatibility = JavaVersion.VERSION_17
}

jar {
	inputs.property "archivesName", project.base.archivesName

	from("LICENSE") {
		rename { "${it}_${inputs.properties.archivesName}"}
	}
}